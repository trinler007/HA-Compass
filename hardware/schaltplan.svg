<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#1f2328">HA-Compass – Verdrahtung</text>

  <!-- Gehäuse -->
  <rect x="250" y="50" width="490" height="300" rx="8" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="262" y="70" font-size="12" fill="#57606a">Gehäuse (PETG) · Boden an Schrankdecke</text>

  <!-- Bordnetz -->
  <rect x="20" y="70" width="160" height="50" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="100" y="100" font-size="14" text-anchor="middle" fill="#1f2328">24 V Bordnetz</text>
  <line x1="100" y1="120" x2="100" y2="170" stroke="#1f2328" stroke-width="2"/>

  <!-- Step-Down -->
  <rect x="20" y="170" width="160" height="62" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="100" y="196" font-size="14" text-anchor="middle" fill="#1f2328">Step-Down 24 → 5 V</text>
  <text x="100" y="216" font-size="11" text-anchor="middle" fill="#57606a">Nachbarschrank</text>

  <!-- 5V Leitung -->
  <line x1="180" y1="201" x2="300" y2="201" stroke="#cf222e" stroke-width="2.5"/>
  <text x="215" y="192" font-size="11" text-anchor="middle" fill="#57606a">5 V · ca. 60 cm</text>
  <circle cx="250" cy="201" r="7" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="250" y="228" font-size="10" text-anchor="middle" fill="#57606a">USB-Buchse</text>
  <text x="250" y="240" font-size="10" text-anchor="middle" fill="#57606a">Ø 12 mm</text>

  <!-- ESP32 -->
  <rect x="300" y="120" width="170" height="190" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="385" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328">ESP32-S3</text>
  <text x="385" y="162" font-size="11" text-anchor="middle" fill="#57606a">DevKitC-1</text>
  <text x="310" y="205" font-size="12" fill="#1f2328">USB</text>
  <text x="460" y="194" font-size="12" text-anchor="end" fill="#1f2328">3V3</text>
  <text x="460" y="229" font-size="12" text-anchor="end" fill="#1f2328">GND</text>
  <text x="460" y="264" font-size="12" text-anchor="end" fill="#1f2328">GPIO 11</text>
  <text x="460" y="299" font-size="12" text-anchor="end" fill="#1f2328">GPIO 12</text>

  <!-- MMC5603 -->
  <rect x="590" y="120" width="130" height="190" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="655" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328">MMC5603</text>
  <text x="655" y="162" font-size="11" text-anchor="middle" fill="#57606a">Adafruit #5579 · 0x30</text>
  <text x="600" y="194" font-size="12" fill="#1f2328">VIN</text>
  <text x="600" y="229" font-size="12" fill="#1f2328">GND</text>
  <text x="600" y="264" font-size="12" fill="#1f2328">SDA</text>
  <text x="600" y="299" font-size="12" fill="#1f2328">SCL</text>

  <!-- Leitungen -->
  <g stroke-width="2.5">
    <line x1="470" y1="190" x2="590" y2="190" stroke="#cf222e"/>
    <line x1="470" y1="225" x2="590" y2="225" stroke="#1f2328"/>
    <line x1="470" y1="260" x2="590" y2="260" stroke="#0969da"/>
    <line x1="470" y1="295" x2="590" y2="295" stroke="#bf8700"/>
  </g>

  <!-- Legende -->
  <g font-size="11" fill="#1f2328">
    <line x1="270" y1="372" x2="290" y2="372" stroke="#cf222e" stroke-width="3"/><text x="296" y="376">3,3 V</text>
    <line x1="345" y1="372" x2="365" y2="372" stroke="#1f2328" stroke-width="3"/><text x="371" y="376">GND</text>
    <line x1="415" y1="372" x2="435" y2="372" stroke="#0969da" stroke-width="3"/><text x="441" y="376">SDA</text>
    <line x1="480" y1="372" x2="500" y2="372" stroke="#bf8700" stroke-width="3"/><text x="506" y="376">SCL</text>
    <text x="555" y="376" fill="#57606a">SDA/SCL mit GND verdrillen</text>
  </g>

  <!-- Abstand -->
  <line x1="470" y1="330" x2="590" y2="330" stroke="#57606a" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="530" y="344" font-size="11" text-anchor="middle" fill="#57606a">ca. 10 cm</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
